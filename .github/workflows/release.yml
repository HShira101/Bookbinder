name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and URLs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg version "$VERSION" \
             --arg manifest "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/module.json" \
             --arg download "$REPO/releases/download/v$VERSION/module.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             module.json > module.tmp && mv module.tmp module.json

      - name: Package
        run: zip -r module.zip module.json README.md scripts styles templates lang presets

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
